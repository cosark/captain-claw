; Captain Claw voice client for the M5Stack StickS3 (ESP32-S3-PICO-1-N8R8).
; Build + flash:  pio run -t upload      Serial log:  pio device monitor
[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; One app slot (no OTA): room for the 16/24 px fonts. NVS stays at 0x9000, so
; saved settings survive the switch.
board_build.partitions = max_app_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5Unified
    https://github.com/m5stack/M5PM1
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
